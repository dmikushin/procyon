name: Run Maven tests on PRs
on: [push, pull_request]
jobs:
  maven:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
        java-version: 11
        distribution: 'temurin'
    - name: Run Maven tests
      run: mvn test
